name: Iki Android APK Derle
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
      - name: Projeyi ac
        run: mkdir -p project && tar -xJf android-project.tar.xz -C project
      - name: Kullanici uygulamasi kapanma onlemini uygula
        run: python3 tools/fix_receiver_crash.py
      - name: Sessiz mod siren sesi duzeltmesini uygula
        run: python3 tools/enable_alarm_boost.py
      - name: Sessiz mod ses oynaticisi ve kalici imza destegi
        run: python3 tools/sound_diagnostics_and_signing_v23.py
      - name: Kalici imzalama anahtarini etkinlestir
        env:
          SIREN_SIGNING_PACKAGE: ${{ secrets.SIREN_SIGNING_PACKAGE }}
        run: |
          if [ -z "$SIREN_SIGNING_PACKAGE" ]; then
            echo "::warning::Kalici imza anahtari tanimli degil. Debug imza ile uretilen APK sonraki surume dogrudan guncellenemez."
          else
            python3 - <<'PY'
          import os, base64, json
          data=json.loads(base64.b64decode(os.environ["SIREN_SIGNING_PACKAGE"]))
          path=os.path.abspath("project/private-signing.jks")
          with open(path,"wb") as f: f.write(base64.b64decode(data["keystore"]))
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("SIREN_KEYSTORE_PATH="+path+"\n")
              f.write("SIREN_KEYSTORE_PASSWORD="+data["password"]+"\n")
              f.write("SIREN_KEY_ALIAS="+data["alias"]+"\n")
              f.write("SIREN_KEY_PASSWORD="+data["key_password"]+"\n")
          print("Kalici imzalama anahtari yuklendi.")
          PY
          fi
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android platformunu kur
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: QR eslesme testi
        run: cd project && bash tests/test_pairing.sh
      - name: Ana ve Kullanici APK derle
        run: cd project && gradle --no-daemon :ana:assembleDebug :kullanici:assembleDebug
      - name: Iki APKyi indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: Ana-ve-Kullanici-APK
          path: |
            project/ana/build/outputs/apk/debug/ana-debug.apk
            project/kullanici/build/outputs/apk/debug/kullanici-debug.apk
          if-no-files-found: error
